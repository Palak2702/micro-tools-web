<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us – Free Online Tools</title>
    <meta
      name="description"
      content="Contact us for questions, feedback or suggestions regarding our free online tools platform."
    />

    <link rel="stylesheet" href="../../assets/css/style.css" />
  </head>
  <body>
    <div id="header"></div>

    <div class="container contact-container">
      <h1 class="page-title">Contact Us</h1>

      <div class="card">
        <p class="tool-intro">
          Have questions, suggestions, or feedback? We'd love to hear from you.
          Feel free to reach out anytime.
        </p>
      </div>

      <div class="card">
        <h2>Get in Touch</h2>
        <ul>
          <li>Tool suggestions</li>
          <li>Bug reports</li>
          <li>Feedback & improvements</li>
          <li>Business inquiries</li>
        </ul>
      </div>

      <div class="card">
        <h2>Email Support</h2>
        <!-- <p>📧 <strong>your@email.com</strong></p> -->
        <p>We usually respond within 24–48 hours.</p>
      </div>

      <div class="card">
        <h2>Quick Contact Form</h2>

        <form class="contact-form">
          <input type="text" placeholder="Your Name" required />
          <input type="email" placeholder="Your Email" required />
          <textarea placeholder="Your Message" rows="5" required></textarea>
          <button type="submit">Send Message</button>
        </form>
      </div>
    </div>

    <div id="footer"></div>

    <script src="../../assets/js/main.js"></script>
  </body>
</html>
